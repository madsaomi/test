<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку — Stanford English Test</title>
    <meta name="theme-color" content="#FFB703">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/static/favicon-256.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=7">
    <style>
        body { -webkit-user-select: auto; user-select: auto; }
        .container { max-width: 420px; }
        .token-input {
            width: 100%; padding: 15px 16px; border: 2px solid var(--border); border-radius: 12px;
            font-size: 16px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: #fff;
            -webkit-user-select: text; user-select: text;
        }
        .token-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255, 183, 3, 0.18); }
        .login-error { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; text-align: left; }
        .hint { font-size: 13px; color: var(--text-muted); margin-top: 18px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="rings rings-1"></div>

<div class="container">
    <img src="/static/logo_app_icon.png" alt="Логотип" class="logo" style="width: 72px; border-radius: 18px;">
    <h1 style="font-size: 24px;">Админка</h1>
    <p class="subtitle" style="margin-bottom: 22px;">Результаты тестирования Stanford LC</p>

    {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="/admin/login" autocomplete="off">
        <label class="field-title" for="token" style="text-align: left; margin-top: 0;">Токен администратора</label>
        <input class="token-input" type="password" id="token" name="token" required autofocus
               placeholder="ADMIN_TOKEN из настроек сервера">
        <button class="btn" type="submit">Войти</button>
    </form>

    <p class="hint">Вход сохраняется на 12 часов на этом устройстве.<br>После 10 неверных попыток вход блокируется на 15 минут.</p>
</div>

</body>
</html>
